[package]
name = "wo"
version = "0.1.0"
edition = "2021"
description = "Zeigt an, wo sich Personen laut Home Assistant befinden"

[[bin]]
name = "wo"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
